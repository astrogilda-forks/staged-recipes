schema_version: 1

context:
  name: agent-evidence-vectors
  version: "0.18.1"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/agent_evidence_vectors-${{ version }}.tar.gz
  sha256: 3af55653a65c35f32a90f291eda6eda3619321380567999c0d7f0c705976ee2f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - agent-evidence-vectors = agent_evidence_vectors.run_vectors:main
      - agent-evidence-heldout = agent_evidence_vectors.heldout:main
      - agent-evidence-vectors-remora-e7 = agent_evidence_vectors.remora_e7.run:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - agent_evidence_vectors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - agent-evidence-heldout --help
      # Runs the bundled conformance vectors against the reference verifier.
      - agent-evidence-vectors

about:
  summary: Conformance corpora and reference verifiers for agent evidence records
  # The package ships third-party fixture and specification files with their own licenses.
  license: Apache-2.0 AND BUSL-1.1
  license_file:
    - LICENSE
    - packaging/agent_evidence_vectors/remora_e7/upstream/LICENSE
    - packaging/agent_evidence_vectors/remora_e7/upstream/NOTICE
    - vectors-ai-generation/spec-vendored/LICENSE-13fd0a8b
    - vectors-ai-generation/spec-vendored/LICENSE-17b964ee
  homepage: https://github.com/probityai/agent-evidence-vectors
  repository: https://github.com/probityai/agent-evidence-vectors
  documentation: https://probityai.github.io/agent-evidence-vectors/start.html

extra:
  recipe-maintainers:
    - astrogilda
